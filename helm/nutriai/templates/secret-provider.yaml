{{- if (index .Values "api-gateway").enabled }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: api-gateway-secret-provider
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  provider: azure
  secretObjects:
  - secretName: api-gateway-secrets
    type: Opaque
    data:
    - objectName: database-url
      key: DATABASE_URL
    - objectName: jwt-secret-key
      key: JWT_SECRET_KEY
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    clientID: {{ .Values.clientID | quote }}
    keyvaultName: {{ .Values.keyvaultName | quote }}
    objects:  |
      array:
        - |
          objectName: database-url
          objectType: secret
        - |
          objectName: jwt-secret-key
          objectType: secret
    tenantId: {{ .Values.tenantId | quote }}
{{- end}}
---
{{- if (index .Values "auth-service").enabled }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: auth-service-secret-provider
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  provider: azure
  secretObjects:
  - secretName: auth-service-secrets
    type: Opaque
    data:
    - objectName: database-url
      key: DATABASE_URL
    - objectName: jwt-secret-key
      key: JWT_SECRET_KEY
    - objectName: entra-client-id
      key: ENTRA_CLIENT_ID
    - objectName: entra-client-secret
      key: ENTRA_CLIENT_SECRET
    - objectName: entra-tenant-id
      key: ENTRA_TENANT_ID
    - objectName: entra-redirect-uri
      key: ENTRA_REDIRECT_URI
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    clientID: {{ .Values.clientID | quote }}
    keyvaultName: {{ .Values.keyvaultName | quote }}
    objects:  |
      array:
        - |
          objectName: database-url
          objectType: secret
        - |
          objectName: jwt-secret-key
          objectType: secret
          # Corrected: standard indentation for objects block
        - |
          objectName: entra-client-id
          objectType: secret
        - |
          objectName: entra-client-secret
          objectType: secret
        - |
          objectName: entra-tenant-id
          objectType: secret
        - |
          objectName: entra-redirect-uri
          objectType: secret
    tenantId: {{ .Values.tenantId | quote }}
{{- end}}
