---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: profile-service
  namespace: {{ .Values.namespace }}
  labels:
    app: profile-service
    app.kubernetes.io/part-of: nutriai
spec:
  replicas: {{ (index .Values "profile-service").replicas }}
  selector:
    matchLabels:
      app: profile-service
  template:
    metadata:
      labels:
        app: profile-service
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: nutriai-service-account
      containers:
        - name: profile-service
          image: "{{ .Values.image.registry }}/profile-service:{{ (index .Values "profile-service").image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8006
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: profile-service-secrets
                  key: DATABASE_URL
          volumeMounts:
            - name: secrets-store-inline
              mountPath: "/mnt/secrets-store"
              readOnly: true
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8006
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8006
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: secrets-store-inline
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: "profile-service-secret-provider"
---
apiVersion: v1
kind: Service
metadata:
  name: profile-service
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: profile-service
  ports:
    - port: 8006
      targetPort: 8006
  type: ClusterIP
