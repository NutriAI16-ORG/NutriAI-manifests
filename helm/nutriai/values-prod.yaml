namespace: nutriai-prod
keyvaultName: nutriai-kv-prod
clientID: prod-identity-client-id
tenantId: placeholder-entra-tenant-id-prod
image:
  registry: nutriaiacr1602.azurecr.io
  pullPolicy: Always
ingress:
  host: nutriai.example.com
admin-service:
  replicas: 1
  image:
    tag: v0.0.4
api-gateway:
  replicas: 2
  image:
    tag: latest
auth-service:
  replicas: 2
  image:
    tag: v0.0.7
diet-service:
  replicas: 2
  image:
    tag: v0.0.4
  hpa:
    minReplicas: 2
    maxReplicas: 5
document-service:
  replicas: 2
  image:
    tag: v0.0.4
frontend:
  replicas: 2
  image:
    tag: v0.0.3
  hpa:
    minReplicas: 2
    maxReplicas: 5
health-service:
  replicas: 2
  image:
    tag: v0.0.6
notification-service:
  replicas: 1
  image:
    tag: v0.0.7
profile-service:
  replicas: 2
  image:
    tag: v0.0.6
api-gateway-service:
  image:
    tag: v0.0.6
config:
  apiGateway:
    authServiceUrl: "http://auth-service:8001"
    documentServiceUrl: "http://document-service:8002"
    dietServiceUrl: "http://diet-service:8003"
    healthServiceUrl: "http://health-service:8004"
    notificationServiceUrl: "http://notification-service:8005"
    profileServiceUrl: "http://profile-service:8006"
    adminServiceUrl: "http://admin-service:8007"
  dietService:
    azureOpenaiDeploymentName: "placeholder-openai-deployment-name"
    azureOpenaiApiVersion: "placeholder-openai-api-version"
    azureServiceBusTopicName: "meal-reminders"
  documentService:
    azureStorageContainerName: "nutriai-documents"
  frontend:
    backendUrl: "http://api-gateway:8000"
  notificationService:
    azureServiceBusTopicName: "meal-reminders"
    azureServiceBusSubscriptionName: "email-sender"
    smtpHost: "smtp.gmail.com"
    smtpPort: "587"
    smtpFromEmail: "noreply@nutriai-health.com"
    appUrl: "https://nutriai.example.com"
