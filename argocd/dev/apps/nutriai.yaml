apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nutriai-dev-app
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://github.com/NutriAI16-ORG/NutriAI-manifests.git
    targetRevision: main
    path: helm/nutriai
    helm:
      valueFiles:
        - values-dev.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: nutriai-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
