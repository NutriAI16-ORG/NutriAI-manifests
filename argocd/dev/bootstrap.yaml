apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nutriai-dev-bootstrap
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/NutriAI16-ORG/NutriAI-manifests.git
    targetRevision: main
    path: argocd/dev/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
