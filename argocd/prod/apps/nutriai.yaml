apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nutriai-prod-app
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://github.com/NutriAI16-ORG/NutriAI-manifests.git
    targetRevision: main
    path: helm/nutriai
    helm:
      valueFiles:
        - values-prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: nutriai-prod
  syncPolicy:
    # No automated sync (manual sync required for production gatekeeping)
    syncOptions:
      - CreateNamespace=false
