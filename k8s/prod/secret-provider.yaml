apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: diet-service-secret-provider
  namespace: nutriai-prod
  # Service Bus auth: Workload Identity → DefaultAzureCredential → Azure RBAC (no connection string in prod)
spec:
  provider: azure
  secretObjects:
  - secretName: diet-service-secrets
    type: Opaque
    data:
    - objectName: database-url
      key: DATABASE_URL
    - objectName: azure-openai-endpoint
      key: AZURE_OPENAI_ENDPOINT
    - objectName: azure-openai-key
      key: AZURE_OPENAI_KEY
    # AZURE_SERVICE_BUS_CONNECTION_STRING is intentionally absent in prod.
    # App uses DefaultAzureCredential via Workload Identity for Service Bus access.
    # For local dev: set AZURE_SERVICE_BUS_CONNECTION_STRING in your .env file.
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    clientID: "c9c04b34-93e4-4c93-a27c-7c6aa3c88e80"
    keyvaultName: "nutriai-kv-prod-v3"
    objects:  |
      array:
        - |
          objectName: database-url
          objectType: secret
        - |
          objectName: azure-openai-endpoint
          objectType: secret
        - |
          objectName: azure-openai-key
          objectType: secret
    tenantId: "cb69c701-1ad6-4282-bcda-0982701e13a6"
---
