apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: api-gateway-secret-provider
  namespace: nutriai-prod
spec:
  provider: azure
  secretObjects:
  - secretName: api-gateway-secrets
    type: Opaque
    data:
    - objectName: database-url
      key: DATABASE_URL
    - objectName: jwt-secret-key
      key: JWT_SECRET_KEY
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    clientID: "c9c04b34-93e4-4c93-a27c-7c6aa3c88e80"
    keyvaultName: "nutriai-kv-prod-v3"
    objects:  |
      array:
        - |
          objectName: database-url
          objectType: secret
        - |
          objectName: jwt-secret-key
          objectType: secret
    tenantId: "cb69c701-1ad6-4282-bcda-0982701e13a6"
