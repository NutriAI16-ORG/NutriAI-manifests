apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: diet-service-hpa
  namespace: nutriai-prod
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: diet-service
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
