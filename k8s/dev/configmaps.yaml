apiVersion: v1
kind: ConfigMap
metadata:
  name: api-gateway-config
  namespace: nutriai-dev
data:
  AUTH_SERVICE_URL: "http://auth-service:8001"
  DOCUMENT_SERVICE_URL: "http://document-service:8002"
  DIET_SERVICE_URL: "http://diet-service:8003"
  HEALTH_SERVICE_URL: "http://health-service:8004"
  NOTIFICATION_SERVICE_URL: "http://notification-service:8005"
  PROFILE_SERVICE_URL: "http://profile-service:8006"
  ADMIN_SERVICE_URL: "http://admin-service:8007"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: diet-service-config
  namespace: nutriai-dev
data:
  AZURE_OPENAI_DEPLOYMENT_NAME: "gpt-5.1"
  AZURE_OPENAI_API_VERSION: "2024-02-01"
  AZURE_SERVICE_BUS_TOPIC_NAME: "email-notifications"
  AZURE_SERVICE_BUS_FULLY_QUALIFIED_NAMESPACE: "nutriai-sb-dev.servicebus.windows.net"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: document-service-config
  namespace: nutriai-dev
data:
  AZURE_STORAGE_CONTAINER_NAME: "nutriai-documents"
  AZURE_OPENAI_DEPLOYMENT_NAME: "gpt-5.1"
  AZURE_OPENAI_API_VERSION: "2024-02-01"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-config
  namespace: nutriai-dev
data:
  BACKEND_URL: "http://api-gateway:8000"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: notification-service-config
  namespace: nutriai-dev
data:
  AZURE_SERVICE_BUS_TOPIC_NAME: "email-notifications"
  AZURE_SERVICE_BUS_SUBSCRIPTION_NAME: "email-sender"
  AZURE_SERVICE_BUS_FULLY_QUALIFIED_NAMESPACE: "nutriai-sb-dev.servicebus.windows.net"
  SMTP_HOST: "smtp.gmail.com"
  SMTP_PORT: "587"
  SMTP_FROM_EMAIL: "noreply@nutriai-health.com"
  APP_URL: "https://nutriai.example.com"
